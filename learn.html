  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141312; --surface:#1F1E1C; --ink:#F0EEEA; --ink2:#CFCBC5; --muted:#A5A19B; --line:#35332F; --sunk:#292826;
      --soft:#1A2640; --soft-ink:#A9C1FF;
      --blue:#5B8CF5; --blue-ink:#0B1220; --blue-soft:#243756;
      --chat:#1B222D; --me:#6FBF55; --me-ink:#0E1A09; --bot:#2A2927;
      --ok:#4ADE80; --ok-soft:#133422; --no:#FF8A80; --no-soft:#3C1D1A;
      --warn-ink:#F3C56B; --warn-soft:#3A2D10;
      --pink:#3E1F1D; --pink-ink:#FF9A92;
      --btn:#F0EEEA; --btn-ink:#141312; --focus:#8DB0FF;
      --net-bg:#0C1118; --net-line:#243044;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:calc(72px + env(safe-area-inset-top)); scroll-padding-bottom:calc(88px + env(safe-area-inset-bottom))}   /* 用鍵盤跳到的東西，不要被上面那條、固定在底的上一課／下一課列蓋住 */
  body{margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  button{font:inherit; color:inherit; cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:8px}
  [hidden]{display:none!important}
  .sr{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
  .wrap{max-width:var(--col); margin:0 auto; padding:8px 16px 32px; outline:none}
  @media (min-width:700px){ :root{--cs:1.15} }
  @media (min-width:800px){ :root{--col:760px; --cs:1.25} }
  @media (min-width:1100px){ :root{--col:880px; --cs:1.4} }
  .wrap.bot{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .loading{padding:40px 0; text-align:center; color:var(--muted)}

  /* ── 上面那條（目錄頁：只有「補藥神器 教學」；一課的頁：課名 ▾／第 n 課）── 三欄：標題永遠在正中間 */
  .bar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top)}
  .bar-in{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr); align-items:center; max-width:var(--col); margin:0 auto; padding:0 8px; min-height:54px}
  .ttl{grid-column:2; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 6px; border:0; background:none; font-size:16.5px; font-weight:800; color:var(--ink)}
  .ttl .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ttl .ar{flex:none; font-size:12px; color:var(--muted); transition:transform .15s}
  .ttl[aria-expanded="true"] .ar{transform:rotate(180deg)}
  .tag{grid-column:3; justify-self:end; padding:0 8px 0 0; text-align:right; font-size:13px; color:var(--muted); white-space:nowrap}
  .toc{position:absolute; left:0; right:0; top:100%; max-height:calc(100vh - 80px); overflow-y:auto; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 18px 30px rgba(0,0,0,.14)}
  .toc-in{max-width:var(--col); margin:0 auto; padding:10px 16px 16px}
  .toc-back{display:flex; align-items:center; min-height:44px; margin:0 0 6px; padding:6px 10px; border-radius:12px; color:var(--ink2); font-size:14.5px; font-weight:700; text-decoration:none}
  .toc-back:hover{background:var(--sunk)}

  /* ── 課程目錄 ── */
  .hero{padding:18px 0 4px}
  h1{margin:0 0 10px; font-size:29px; line-height:1.35; font-weight:800; letter-spacing:-.01em; text-wrap:balance}
  .sub{margin:0 0 18px; color:var(--ink2); font-size:15.5px; line-height:1.8}
  .prog{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
  .prog-r{display:flex; justify-content:space-between; align-items:baseline; font-size:14.5px; color:var(--ink2)}
  .prog-r b{font-size:17px; color:var(--ink); font-weight:800}
  .track{height:8px; border-radius:4px; background:var(--line); overflow:hidden}
  .track i{display:block; height:100%; border-radius:4px; background:var(--ok)}
  .cta{display:flex; align-items:center; justify-content:center; min-height:54px; padding:0 18px; border-radius:14px; background:var(--btn); color:var(--btn-ink); font-size:17px; font-weight:800; text-decoration:none; text-align:center}
  .cta.sec2{background:var(--surface); color:var(--ink); border:1.5px solid var(--ink)}
  .all{margin:26px 0 10px; font-size:15px; font-weight:800; color:var(--ink2); letter-spacing:.04em}
  .chap{margin:0 0 12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .chap-h{display:flex; align-items:center; gap:8px; width:100%; min-height:50px; padding:6px 16px; border:0; background:none; text-align:left; font-size:15.5px; font-weight:800}
  .chap-h:focus-visible{outline-offset:-3px; border-radius:17px}   /* 外框畫在按鈕裡面：.chap 的 overflow:hidden 會把畫在外面的部分切掉 */
  .chev{flex:none; width:16px; color:var(--muted); font-size:13px}
  .chap-c{margin-left:auto; color:var(--muted); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .lessons{list-style:none; margin:0; padding:0 8px 8px}
  .lrow{display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 10px; border-radius:12px; text-decoration:none; color:var(--ink)}
  .lrow .li{flex:none; width:22px; text-align:center; color:var(--muted); font-size:14px}
  .lrow .ln{flex:1; min-width:0; font-size:16px; font-weight:700}
  .lrow.done .li{color:var(--ok); font-weight:800}
  .lrow.cur{background:var(--btn); color:var(--btn-ink)}
  .lrow.cur .li{color:var(--btn-ink)}
  .lrow:not(.cur):hover{background:var(--sunk)}
  .foot{padding:22px 0 0; font-size:13px; color:var(--muted); text-align:center; line-height:1.8}

  /* ── 一課（白底圓角區塊一塊接一塊） ── */
  .sec{margin:0 0 14px; padding:18px 16px 16px; background:var(--surface); border:1px solid var(--line); border-radius:22px}
  .sec-h{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin:0 0 8px}
  h2{margin:0; font-size:21px; line-height:1.4; font-weight:800; text-wrap:balance}
  .lead{margin:0 0 14px; color:var(--ink2); font-size:15.5px; line-height:1.85}
  .lead b,.note b,.rc b{font-weight:800}
  .lead b,.rc b{color:var(--ink)}
  .note{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--soft); color:var(--ink); font-size:15px; line-height:1.85}
  .note b{color:var(--soft-ink)}
  .warnbox{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--warn-soft); color:var(--warn-ink); font-size:15px; font-weight:700; line-height:1.8}
  .capn{margin:8px 2px 0; font-size:12.5px; color:var(--muted); line-height:1.6}
  .capq{margin:-4px 2px 0; font-size:14px; color:var(--ink2); line-height:1.6}

  /* ── 示範區（LINE 聊天的假畫面） ── */
  .stage{position:relative; display:flex; flex-direction:column; gap:10px; padding:10px; margin:0 -6px; border-radius:16px; background:var(--sunk)}   /* position:relative：自動示範的手指（.fg）以示範區為準定位 */
  @media (max-width:520px){ .wrap.bot{padding-left:8px; padding-right:8px} .sec{padding:16px 12px 14px} .stage{margin:0 -12px; padding:10px 8px} }   /* 手機：邊邊讓出來，聊天室才夠寬（卡片才跟 LINE 上一樣大） */
  .stage-h{display:flex; align-items:center; justify-content:space-between; gap:0 8px; min-height:28px}   /* 一律一行（不折行）：自動示範的小標、「停止」放進來也不會把下面的東西推開；標題自己在裡面折成兩行（「重播」鍵 44px 高，兩行字放得下，整列高度不變），「重播」鍵也不會被擠到下一行 */
  .stage-t{flex:1 1 0; min-width:0; display:flex; align-items:center; min-height:38px; font-size:14px; font-weight:800; line-height:1.35; color:var(--ink2)}   /* 38＝兩行字的高度：標題一行或折成兩行，這個框都一樣高、一樣的位置——不然瀏覽器的「捲動錨點」會把標題當錨，標題一動，整頁就被偷偷捲幾個像素 */
  .replay{flex:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:44px; min-height:44px; padding:0 10px; border:0; border-radius:12px; background:none; color:var(--ink2); font-size:14px; font-weight:700}
  .picks{display:flex; flex-wrap:wrap; gap:8px}
  .pk{min-height:44px; padding:6px 16px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); font-size:15px; font-weight:700}
  .pk[aria-pressed="true"]{border-color:var(--btn); background:var(--btn); color:var(--btn-ink)}
  .picks.list{flex-direction:column; flex-wrap:nowrap}
  .picks.list .pk{display:flex; align-items:center; gap:12px; width:100%; padding:10px 14px; border-radius:14px; text-align:left; font-size:15px; font-weight:600; line-height:1.6}
  .pk .n{flex:none; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--sunk); color:var(--ink); font-size:13px; font-weight:800}
  .pk[aria-pressed="true"] .n{background:var(--btn-ink); color:var(--btn)}
  /* 聊天室：照 LINE 的樣子——官方帳號的頭像（第一則的左邊，卡片的話在卡片上面一行）、您傳的訊息左邊有「已讀＋時間」、照片就是一張圖（沒有泡泡）、語音是綠泡泡＋播放鍵＋聲波 */
  .chat{position:relative; display:flex; flex-direction:column; gap:8px; min-height:92px; padding:10px 4px 8px; border-radius:14px; background:var(--chat)}   /* position:relative：聊天示範裡「按」按鍵的手指（.fg）以聊天室為準定位 */
  .rw{display:flex; align-items:flex-end; gap:6px; min-width:0}
  .rw.me{justify-content:flex-end}
  .rw.bot{justify-content:flex-start}
  .rw.card{flex-direction:column; align-items:stretch; gap:5px}
  .ava{flex:none; width:calc(36px*var(--cs)); height:calc(36px*var(--cs)); border-radius:50%; background:#fff var(--i-ava) center / 88% no-repeat; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .ava.sp{background:none; box-shadow:none}   /* 同一串回覆的第二則以後：不畫頭像，但留同樣的位置，泡泡才會跟第一則對齊 */
  .rw.bot>.ava{align-self:flex-start}
  .mt{flex:none; font-size:calc(11px*var(--cs)); line-height:1.35; color:var(--muted); text-align:right; white-space:nowrap}
  .mt span{display:block}
  .bub{max-width:min(80%,calc(420px*var(--cs))); padding:8px 12px; border-radius:18px; font-size:calc(15px*var(--cs)); line-height:1.55; white-space:pre-line; overflow-wrap:anywhere}
  .bub.me{background:var(--me); color:var(--me-ink)}
  .bub.bot{background:var(--bot); color:var(--ink)}
  .rw.first .bub.me{border-top-right-radius:4px}
  .rw.first .bub.bot{border-top-left-radius:4px}
  .gapm{align-self:center; padding:2px 12px; border-radius:999px; background:var(--sunk); color:var(--ink2); font-size:calc(12.5px*var(--cs)); font-weight:700}
  .pho{position:relative; flex:none; width:min(60%,calc(232px*var(--cs))); aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:#E4E7EB; box-shadow:0 0 0 1px rgba(0,0,0,.1)}
  .pho i{position:absolute; left:0; top:0; right:0; bottom:0; background:var(--i-pt) center / cover no-repeat}
  .pho.w i{background-image:var(--i-pw)}
  .pho.blur i{filter:blur(3px); transform:scale(1.12)}
  .pho.three i{background-image:var(--i-pt),var(--i-pw),var(--i-pt); background-size:36% auto; background-position:2% 50%,50% 50%,98% 50%}
  .pho.pp{container-type:inline-size; width:min(54%,calc(200px*var(--cs))); aspect-ratio:3/4; background:#C8B99F}
  .pho.pp .pa{position:absolute; left:8%; right:8%; top:5%; bottom:5%; padding:12px 9px 6px; padding:6cqw 5cqw 3cqw; background:#FFFDF2; box-shadow:0 2px 7px rgba(0,0,0,.3); transform:rotate(-1.5deg); overflow:hidden}
  .pho.pp .pa div{padding:0 2px; border-bottom:1px solid #D5DCEA; color:#2A3340; font-family:"Kaiti TC","BiauKai","DFKai-SB",cursive,serif; font-size:13px; font-size:7.4cqw; line-height:1.85; white-space:nowrap}
  .vo{display:flex; align-items:center; gap:8px; min-width:calc(154px*var(--cs)); padding:7px 14px 7px 8px; border-radius:18px; background:var(--me); color:var(--me-ink); font-size:calc(14px*var(--cs)); font-variant-numeric:tabular-nums}
  .rw.first .vo{border-top-right-radius:4px}
  .vp{flex:none; display:flex; align-items:center; justify-content:center; width:calc(28px*var(--cs)); height:calc(28px*var(--cs)); border-radius:50%; background:#fff}
  .vp::before{content:""; display:block; margin-left:3px; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #2E7D32}
  .bars{display:flex; align-items:center; gap:3px; height:calc(20px*var(--cs)); flex:1}
  .bars i{display:block; width:3px; border-radius:2px; background:var(--me-ink); opacity:.75}
  .pop{animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

  /* ── LINE 輸入列（按鈕、麥克風的位置） ── */
  /* 照 LINE 的樣子：上面是一整排小按鈕（只有一排，放不下就左右滑），下面是輸入框（＋、相機、相簿、「Aa ☺」的輸入框、麥克風）。
     大小都用「這個框的寬度」算（cqw）：窄手機上整排縮小，四顆還是都在同一排；不支援 cqw 的老瀏覽器改成按鈕換行。 */
  .qbar{container-type:inline-size; width:100%; max-width:480px; margin-inline:auto; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
  .qrow{display:flex; flex-wrap:wrap; gap:6px; padding:8px; background:var(--sunk)}
  .qchip{flex:none; display:inline-flex; align-items:center; min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:13.5px; font-weight:500; white-space:nowrap}
  button.qchip{min-height:40px}
  .qchip.on,.qchip[aria-pressed="true"]{border-color:var(--pink-ink); background:var(--pink); color:var(--pink-ink); font-weight:700}
  .inbar{display:flex; align-items:center; gap:4px; padding:6px 8px}
  .inic{flex:none; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; font-size:19px; color:var(--ink2)}
  .inic.on{border:2px solid var(--pink-ink); background:var(--pink)}
  .inbox{flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; min-height:36px; padding:0 12px; border-radius:18px; background:var(--sunk); color:var(--muted); font-size:15px; white-space:nowrap; overflow:hidden}
  @media (max-width:359px){ .inic.g{display:none} }   /* 老瀏覽器（不支援 cqw）又很窄時：少畫一個相簿圖示，輸入框才放得下 */
  @supports (width:1cqw){
    .qrow{flex-wrap:nowrap; gap:2cqw; padding:2.2cqw; overflow-x:auto; scroll-padding-inline:2.2cqw; scrollbar-width:none}
    .qrow::-webkit-scrollbar{display:none}
    .qchip{min-height:9.2cqw; padding:0 3.1cqw; font-size:3.6cqw}
    button.qchip{min-height:max(44px,9.6cqw)}
    .inbar{gap:.8cqw; padding:1.6cqw 2.2cqw}
    .inic,.inic.g{display:inline-flex; width:8.8cqw; height:8.8cqw; font-size:5cqw}
    .inbox{min-height:9.2cqw; padding:0 3.1cqw; border-radius:4.6cqw; font-size:3.9cqw}
  }
  /* 第 18 批：按鈕變 5 顆，這一排放不下（跟真的 LINE 手機一樣，往左滑才看得到最後一顆）。手機用滑的；電腦（有滑鼠、視窗夠寬）多一條細捲軸，用滑鼠的人才拉得到。
     只有「真的按得下去」的那排（role=group）才可以自己滑；聊天示範裡畫出來的輸入框（role=img）只是圖：不給滑、也不讓 Tab 停在上面（瀏覽器會讓放不下的捲動區塊變成鍵盤可以停的地方）。 */
  @media (hover:hover) and (pointer:fine) and (min-width:700px){
    .qbar[role="group"] .qrow{scrollbar-width:thin; scrollbar-color:var(--line) transparent}
    .qbar[role="group"] .qrow::-webkit-scrollbar{display:block; height:8px}
    .qbar[role="group"] .qrow::-webkit-scrollbar-thumb{border-radius:4px; background:var(--line)}
  }
  .qbar[role="img"] .qrow{overflow-x:hidden}
  .cmd{align-self:center; padding:6px 16px; border-radius:999px; background:var(--btn); color:var(--btn-ink); font-size:14px; font-weight:700; text-align:center; line-height:1.5}
  .tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px}
  @media (max-width:440px){ .tiles{grid-template-columns:1fr} }
  .tile{padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg); text-align:center; line-height:1.55}
  .tile .e{display:block; font-size:22px; line-height:1.4}
  .tile b{display:block; font-size:14.5px}
  .tile span.s{display:block; color:var(--muted); font-size:13px}

  /* ── 藥品卡片示意（第 15 批）：照 LINE 上真的卡片做——尺寸、顏色、位置都一樣；示範的藥名、位置、照片全是編的 ──
     --u＝卡片寬度的 1/374（手機上 LINE 的大張卡片 giga 大約是 374 寬；小張的 mega 是 300 寬＝其中的 300 份）：卡片放在多窄的畫面裡，長相都跟真的一樣，只是等比例縮放。
     卡片永遠是白底、淺色字（LINE 上的卡片深色模式也不變），所以這一塊的顏色不跟著這頁的深淺色走。
     圖只有五張小圖（藥丸／水滴圖示、圖釘、錠劑／水劑的示範藥品照），都是 --i-* 這幾個變數（見最上面），其他全是 CSS 畫的。 */
  .lcw{container-type:inline-size; --w:calc(100cqw / 374); --u:var(--w); width:100%; max-width:calc(374px*var(--cs))}
  .lcw.act{margin-inline:auto}   /* 單獨一張卡片／平面圖的示範（點名稱看是什麼）：放在框的正中間；聊天室裡的卡片還是靠左，跟 LINE 一樣 */
  @supports not (width:1cqw){ .lcw{--w:min(1px, calc((100vw - 56px) / 374))} }
  .lc,.lb,.lk,.nf,.cdc{box-sizing:border-box; background:#fff; color:#111; border-radius:calc(16*var(--u)); font-size:calc(14*var(--u)); line-height:1.4; font-weight:400; letter-spacing:0; text-align:left; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .lc *,.lb *,.lk *,.nf *,.cdc *{box-sizing:border-box}
  .lc{display:flex; flex-direction:column; padding:calc(10*var(--u))}
  .lc.ct{padding-bottom:calc(18*var(--u)); -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14*var(--u)),transparent); mask-image:linear-gradient(to bottom,#000 calc(100% - 14*var(--u)),transparent)}
  .lc.cb{padding-top:calc(18*var(--u)); -webkit-mask-image:linear-gradient(to top,#000 calc(100% - 14*var(--u)),transparent); mask-image:linear-gradient(to top,#000 calc(100% - 14*var(--u)),transparent)}
  .lc-h{display:flex}
  .lc-hl{flex:5 1 0%; min-width:0; display:flex; flex-direction:column; align-items:flex-start}
  .lc-code{max-width:100%; font-size:calc(35*var(--u)); font-weight:700; color:#3C4043; overflow-wrap:anywhere}
  .lc-brand,.lc-zh{max-width:100%; overflow:hidden; overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2}
  .lc-brand{margin-top:calc(2*var(--u)); font-size:calc(22*var(--u)); font-weight:700}
  .lc-zh{margin-top:calc(4*var(--u)); font-size:calc(19*var(--u)); font-weight:700; color:#1B7F5C}
  .lc-ico{flex:1 1 0%; min-width:0; display:flex; justify-content:flex-end; align-items:flex-start}
  .lc-ico i{display:block; width:100%; max-width:calc(90*var(--u)); aspect-ratio:1/1; background:var(--i-t) right top / contain no-repeat}
  .lc-ico i.w{background-image:var(--i-w)}
  .lc-gen{align-self:flex-start; max-width:100%; margin-top:calc(12*var(--u)); font-size:calc(13*var(--u)); color:#888; overflow-wrap:anywhere}
  .lc-note{display:flex; align-items:center; gap:calc(4*var(--u)); margin-top:calc(12*var(--u)); padding:calc(8*var(--u)); border-radius:calc(6*var(--u)); background:#FFF6E0}
  .lc-nw{flex:0 0 auto; font-size:calc(19*var(--u)); line-height:1.2}
  .lc-nt{flex:1 1 0%; min-width:0; font-size:calc(14*var(--u)); font-weight:700; color:#B26A00; overflow-wrap:anywhere}
  .lc-pan{display:flex; flex-direction:column; gap:calc(8*var(--u)); margin-top:calc(8*var(--u)); padding:calc(8*var(--u)); border-radius:calc(6*var(--u)); background:#F7F7F7}
  .lc-pan.fst{margin-top:calc(12*var(--u))}
  .lc-feat{display:flex; flex-direction:column; gap:calc(2*var(--u)); padding:calc(4*var(--u)); border-radius:calc(6*var(--u)); background:#E8F3FA; color:#0B5F8A}
  .lc-fl{font-size:calc(11*var(--u)); font-weight:700}
  .lc-ft{font-size:calc(14*var(--u)); font-weight:700; overflow-wrap:anywhere}
  .lc-pr{display:flex; gap:calc(8*var(--u))}
  .lc-in{flex:1 1 0%; min-width:0; display:flex; flex-direction:column; gap:calc(2*var(--u))}
  .lc-il{font-size:calc(11*var(--u)); color:#AAAAAA}
  .lc-it{font-size:calc(14*var(--u)); color:#999999; overflow-wrap:anywhere}
  .lc-pw{flex:0 0 calc(140*var(--u)); width:calc(140*var(--u)); display:flex; flex-direction:column; justify-content:center}
  .lc-pf{padding:calc(2*var(--u)); border-radius:calc(4*var(--u)); background:#E8F3FA; color:#0B5F8A; font-size:calc(11*var(--u)); font-weight:700; margin-bottom:calc(4*var(--u))}
  .lc-pf div+div{margin-top:calc(2*var(--u))}
  .lc-ph{width:100%; aspect-ratio:4/3; background:var(--i-pt) center / contain no-repeat}
  .lc-ph.w{background-image:var(--i-pw)}
  .lc-lr{display:flex; align-items:flex-start; gap:calc(8*var(--u)); margin-top:calc(12*var(--u))}
  .lc-loc{flex:0 0 auto; display:flex; align-items:center; gap:calc(4*var(--u)); padding:calc(8*var(--u)); border-radius:calc(6*var(--u)); background:#FFF0F0}
  .lc-pin{flex:0 0 auto; width:calc(50*var(--u)); height:calc(50*var(--u)); background:var(--i-pin) center / contain no-repeat}
  .lc-lt{font-size:calc(22*var(--u)); font-weight:700; color:#D9534F; overflow-wrap:anywhere}
  .lc-loc.long .lc-pin{width:calc(24*var(--u)); height:calc(24*var(--u))}
  .lc-loc.long .lc-lt{font-size:calc(14*var(--u))}
  .lc-sp{display:flex; flex-direction:column; gap:calc(2*var(--u))}
  .lc-sb{width:calc(68*var(--u)); margin:0; padding:calc(8*var(--u)); border:0; border-radius:calc(6*var(--u)); background:#FFE3E0; color:#D9534F; font:inherit; font-size:calc(14*var(--u)); font-weight:700; text-align:center; line-height:1.4}
  .lc-sb.on{background:#D9534F; color:#FFFFFF}
  .lc-map{flex:1 1 0%; min-width:0}
  .lc-fam{margin-top:calc(12*var(--u)); padding:calc(8*var(--u)); border-radius:calc(6*var(--u)); background:#F3EFFB}
  .lc-fh{display:flex; align-items:center; gap:calc(4*var(--u))}
  .lc-fi{flex:0 0 auto; width:calc(26*var(--u)); height:calc(26*var(--u)); background:var(--i-t) center / contain no-repeat}
  .lc-fn{flex:1 1 0%; min-width:0; font-size:calc(16*var(--u)); font-weight:700; color:#5B3FA0}
  .lc-fo{flex:0 0 auto; font-size:calc(14*var(--u)); font-weight:700; color:#7A5FC0}
  .lc-fk{display:flex; flex-direction:column; gap:calc(4*var(--u)); margin-top:calc(8*var(--u))}
  .lc-fk>div{display:flex; gap:calc(8*var(--u)); font-size:calc(13*var(--u)); color:#5B3FA0}
  .lc-fk span{flex:1 1 0%; min-width:0; overflow-wrap:anywhere}
  .lc-fk b{flex:0 0 auto; font-weight:700; color:#7A5FC0}
  .lc-fs{margin-top:calc(8*var(--u)); font-size:calc(13*var(--u)); font-weight:700; color:#7A5FC0}
  .lc-fam .lb-r{padding-left:0; padding-right:0}
  .lc-fam .lb-r+.lb-r{border-top-color:#E6DDF5}
  .lc [data-part].on{outline:calc(2.5*var(--u)) solid #2F66E0; outline-offset:calc(2*var(--u)); border-radius:calc(3*var(--u))}
  .act [data-part]{cursor:pointer}
  /* 列表卡（位置清單、學名／適應症彙整、藥品通知） */
  .lb{padding:calc(14*var(--u))}
  .lb-t{font-size:calc(19*var(--u)); font-weight:700; color:#1F1F1F; overflow-wrap:anywhere}
  .lb-s{margin-top:calc(2*var(--u)); font-size:calc(13*var(--u)); color:#8A8A8A}
  .lb-g{display:flex; align-items:center; gap:calc(4*var(--u)); margin-top:calc(16*var(--u)); font-size:calc(16*var(--u)); font-weight:700; color:#1D6FA5}
  .lb-g i{flex:0 0 auto; width:calc(30*var(--u)); height:calc(30*var(--u)); background:var(--i-t) center / contain no-repeat}
  .lb-g i.w{background-image:var(--i-w)}
  .lb-r{display:flex; align-items:center; gap:calc(8*var(--u)); padding:calc(8*var(--u))}
  .lb-r.sp{border-top:1px solid #EFEFEF}
  .lb-p{flex:0 0 auto; width:calc(60*var(--u)); height:calc(60*var(--u)); border-radius:calc(6*var(--u)); background:#F0F0F0 center / cover no-repeat; display:flex; align-items:center; justify-content:center; text-align:center; font-size:calc(11*var(--u)); color:#AAAAAA}
  .lb-p.t{background-image:var(--i-pt)}
  .lb-p.w{background-image:var(--i-pw)}
  .lb-x{flex:1 1 0%; min-width:0; display:flex; flex-direction:column}

  /* 「加入補藥神器」的卡片（第 18 批）：跟 07 的 _joinQrCard_（mega＝300）一樣大；永遠是淺色。第 21 批：「加入只要 3 步」改成左右滑的 4 張圖卡（.jcard.sl，見下面） */
  .jcard{display:flex; flex-direction:column; padding:calc(16*var(--u)); border-radius:calc(16*var(--u)); line-height:1.4; box-shadow:0 0 0 1px rgba(0,0,0,.08)}   /* LINE 的規則：子元件有寫 margin，就用 margin（取代 spacing）；沒寫就用外層 box 的 spacing。所以 QR 卡（spacing sm＝4）：標題→說明 4、說明→QR 框 8（margin md）、QR 框→官方帳號 ID 4（margin sm） */
  .jcard.jq{width:calc(300*var(--u)); max-width:100%}
  .jcard.js{width:calc(260*var(--u)); max-width:100%; gap:calc(8*var(--u))}
  .jc-t{color:#1B7F5C; font-size:calc(19*var(--bu)); font-weight:700; overflow-wrap:anywhere}
  .jc-p{margin-top:calc(4*var(--u)); color:#3C4043; font-size:calc(14*var(--bu)); overflow-wrap:anywhere}
  .jc-q{margin-top:calc(8*var(--u)); padding:calc(10*var(--u)); border:1px solid #DADCE0; border-radius:calc(8*var(--u)); background:#FFFFFF; line-height:0}
  .jc-g{display:grid; grid-template-columns:repeat(29,1fr); grid-auto-rows:1fr; width:100%; aspect-ratio:1/1; background:#FFFFFF}
  .jc-g i{display:block; min-width:0; min-height:0}
  .jc-g i.k{background:#000000}
  .jc-id{margin-top:calc(4*var(--u)); color:#5F6368; font-size:calc(13*var(--bu)); text-align:center; overflow-wrap:anywhere}
  .jc-h{color:#1F1F1F; font-size:calc(16*var(--bu)); font-weight:700}
  .jc-r{display:flex; align-items:flex-start; gap:calc(8*var(--u))}
  .jc-n{flex:none; width:calc(20*var(--u)); height:calc(20*var(--u)); border-radius:50%; background:#1B7F5C; color:#FFFFFF; font-size:calc(11*var(--bu)); font-weight:700; line-height:1; text-align:center; display:flex; align-items:center; justify-content:center}
  .jc-s{flex:1 1 0%; min-width:0; color:#3C4043; font-size:calc(14*var(--bu)); overflow-wrap:anywhere}
  /* ★ 第 21 批：「加入只要 3 步」改成左右滑的 4 張圖卡（放在 .lcar 裡；每張照 07 的 JOIN_SLIDES：最上面一行小灰字、圓角細框的圖、粗體一行、小字一行） */
  .lcar>.jcard.sl{flex:0 0 calc(300*var(--u)); width:calc(300*var(--u)); padding:calc(12*var(--u)); gap:calc(4*var(--u)); scroll-snap-align:start}
  .jc-x{color:#6B7280; font-size:calc(13*var(--bu))}
  .jc-ph{display:block; width:100%; border:1px solid #DADCE0; border-radius:calc(8*var(--u)); background:#FFFFFF center / contain no-repeat}
  .jc-ph.pt{aspect-ratio:494/720; background-image:url(5v3cfxbw40tw.png)}
  .jc-ph.scan{aspect-ratio:494/720; background-image:url(zqjnprvqm5ru.png); background-size:cover}
  .jc-ph.add{aspect-ratio:484/392; background-image:url(4v0zrahpan6i.png)}
  .jc-ph.welcome{aspect-ratio:712/552; background-image:url(j4zrsdc7pxwg.png)}
  .jcard.sl .jc-h{margin-top:calc(4*var(--u))}   /* LINE 的規則：標題寫了 margin md（8）就用它取代 spacing；上面的 gap 已經是 4，再加 4＝8 */
  .rw.scene{flex-direction:column; align-items:stretch}
  .rw.scene .lcw{margin-inline:auto}
  .pk .pt{display:block; min-width:0}
  .pk .ps{display:block; margin-top:2px; font-size:13px; font-weight:400; line-height:1.5; opacity:.88}
  .picks.seq .pk:not([aria-pressed="true"]) .ps{display:none}   /* 一步一步的示範：手機上只有選到的那一步才展開下面那行小字，整排步驟才不會太長、下面的畫面才看得到 */
  @media (min-width:700px){
    .picks.seq .pk:not([aria-pressed="true"]) .ps{display:block}
    .stage.seq{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); column-gap:14px; align-items:start}   /* 電腦寬的畫面：步驟在左（小字全部展開）、那一步的畫面在右，不用上下捲 */
    .stage.seq>.stage-h,.stage.seq>.capn{grid-column:1 / -1}
    .stage.seq>.picks{grid-column:1; grid-row:2}
    .stage.seq>.chat{grid-column:2; grid-row:2}
  }
  .urlrow{margin-top:12px; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--muted); font-size:13px; line-height:1.6}
  .urlrow .urlt{display:block; margin-top:2px; color:var(--ink); font-size:13.5px; font-weight:700; word-break:break-all; user-select:all; -webkit-user-select:all}
  /* 輪播：一張一張往左滑，旁邊露出下一張的邊（LINE 上就是這樣） */
  .lcar{--u:calc(.9 * var(--w)); display:flex; gap:calc(8*var(--u)); overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none}
  .lcar::-webkit-scrollbar{display:none}
  @media (hover:hover){ .lcar{scrollbar-width:thin; padding-bottom:6px} .lcar::-webkit-scrollbar{display:block; height:6px} .lcar::-webkit-scrollbar-thumb{border-radius:3px; background:rgba(0,0,0,.3)} }   /* 手機上跟 LINE 一樣沒有捲軸（往左滑）；電腦上留一條細的，滑鼠才拉得動 */
  .lcar>.lc,.lcar>.lb{flex:0 0 calc(374*var(--u)); scroll-snap-align:start}
  /* 平面圖：用方塊拼出來（跟真的平面圖同一種畫法：藍色方塊＝棧、灰色長條＝一整排、紅框＝這支藥的那一格、左邊細線是牆，「大門 ←」寫在牆外面） */
  .pl{position:relative; width:100%; aspect-ratio:4/3; container-type:inline-size; overflow:hidden; background:#fff; color:#222}
  .pl i{position:absolute; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:400; line-height:1; white-space:nowrap}
  .pl .pl-w{background:#C6CCE4; width:.35cqw; min-width:1px}
  .pl .pl-b{background:#99ACFF; color:#1B1F3B}
  .pl .pl-g{background:#D9D9D9; color:#333; justify-content:flex-start; padding-left:2.2cqw}
  .pl .pl-h{background:linear-gradient(90deg,#14BFD6,#EEDF57); border:max(1.5px,.95cqw) solid #D6281C; color:#1B1F3B}
  .pl .pl-d{color:#7D8296; align-items:flex-start; justify-content:flex-start}
  .pl .pl-a{height:0; border-top:max(1px,.3cqw) solid #8A90A6; border-radius:0}
  .pl .pl-a::before{content:""; position:absolute; left:0; top:-.9cqw; border-right:1.7cqw solid #8A90A6; border-top:.9cqw solid transparent; border-bottom:.9cqw solid transparent}
  .pl.em .pl-d{background:#FFF1C9; color:#7A4B00; font-weight:700; justify-content:center; align-items:center; border-radius:.8cqw}
  .pl.em .pl-a{border-top-color:#B26A00; border-top-width:max(2px,.6cqw)}
  .pl.em .pl-a::before{top:-1.9cqw; border-right:3cqw solid #B26A00; border-top-width:1.6cqw; border-bottom-width:1.6cqw}
  .pl [data-part].on{box-shadow:inset 0 0 0 max(2px,.9cqw) #2F66E0}   /* 藍框畫在每一塊「裡面」：不會蓋到旁邊的方塊、也不會被旁邊的方塊蓋住 */
  .pl .pl-d.on{background:#DCE7FC; color:#1D3F94; font-weight:700; box-shadow:none}
  .pl .pl-a.on{border-top-color:#2F66E0; border-top-width:max(2px,.7cqw)}
  .pl .pl-a.on::before{border-right-color:#2F66E0}
  .lcw>.pl{border:1px solid #D5D8E6; border-radius:10px}
  .pimg{flex:none; width:min(72%,calc(300px*var(--cs))); overflow:hidden; border-radius:12px; border:1px solid var(--line); background:#fff}   /* 大張的平面圖：LINE 傳過來的一張圖，靠左 */
  /* 「大門處或是出入口在你哪一邊」：中間是平面圖，上、左、右是藥局的前、左手邊、右手邊（虛線框＝牆；不標「後面」，也沒有「後面」的選項）；大門處或是出入口那一面有一段粗線和一張小牌子。
     左右兩邊的牌子和方向字是一個字一行疊起來的（寬度只有一個字；不用直書的設定，每種瀏覽器畫出來都一樣），平面圖左右各留 38px、
     上下由高度撐開（比寬多 16%，轉 90 度站起來也放得下），所以轉到哪個方向，圖都不會蓋住牌子或方向字。 */
  .arena{position:relative; width:100%; max-width:380px; margin:0 auto; aspect-ratio:1/1.16; border:2px dashed var(--line); border-radius:16px; background:var(--surface); overflow:hidden}
  .arena .tpw{position:absolute; left:38px; right:38px; top:0; bottom:0; display:flex; align-items:center}
  .arena .tp{width:100%; transition:transform .55s ease; transform-origin:50% 50%}
  .arena .tp .pl{border:1px solid #D5D8E6}
  .arena .ax{position:absolute; color:var(--muted); font-size:12.5px; font-weight:700; line-height:1.3; white-space:nowrap}
  .arena .ax.f{top:6px; left:50%; transform:translateX(-50%)}
  .arena .ax.l,.arena .ax.r{top:50%; transform:translateY(-50%); width:14px; white-space:normal; word-break:break-all; text-align:center; line-height:1.25}
  .arena .ax.l{left:8px}
  .arena .ax.r{right:8px}
  .arena[data-door="l"] .ax.l,.arena[data-door="r"] .ax.r{top:8px; transform:none}
  .arena .dch{position:absolute; display:flex; align-items:center; justify-content:center; padding:4px 10px; border:1.5px solid var(--warn-ink); border-radius:10px; background:var(--warn-soft); color:var(--warn-ink); font-size:13px; font-weight:800; line-height:1.3; text-align:center; white-space:nowrap}
  .arena .dch.f{top:24px; left:50%; transform:translateX(-50%)}
  .arena .dch.l,.arena .dch.r{display:block; top:50%; transform:translateY(-50%); width:28px; padding:8px 4px; white-space:normal; word-break:break-all; line-height:1.3}
  .arena .dch.l{left:6px}
  .arena .dch.r{right:6px}
  .arena .dg{position:absolute; background:var(--warn-ink); border-radius:3px}
  .arena .dg.f{top:0; left:32%; width:36%; height:6px}
  .arena .dg.l{left:0; top:32%; height:36%; width:6px}
  .arena .dg.r{right:0; top:32%; height:36%; width:6px}
  /* 看平面圖的三個步驟 */
  .steps{display:flex; flex-direction:column; gap:8px; margin:0 0 12px; padding:0; list-style:none}
  .steps.long li{align-items:flex-start}
  .steps li{display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg)}
  .st{display:flex; flex-direction:column; min-width:0; line-height:1.55}
  .st b{font-size:15px}
  .st span{color:var(--muted); font-size:13px}
  /* ★ 第 21 批：同事手機的截圖（只有「👥 加入補藥神器」那一課的動畫示範用）：不是 img 標籤，是 div 的背景圖；圖檔跟 learn.html 放同一個 GitHub 資料夾（相對網址，不連外面的網站；CSP 的 img-src 'self' 本來就准）。
     檔名是亂碼（圖裡有醫院的名字）：這裡寫代號（JP_PAGE 那種，前後各兩個底線），gen_gh.js 換成 src8/_join_names.json 裡的檔名；每一張都有 aria-label 說明圖在講什麼。
     page＝整個「聊天」頁的上半（掃描鈕已經圈了紅圈）；scan＝掃描畫面。一整列置中（跟電腦瀏覽器那種畫面一樣）；.sc-hot＝手指要按的地方（掃描鈕：搜尋列最右邊，用百分比定位在圖上，本身看不見） */
  .scp{position:relative; width:calc(200*var(--u)); max-width:100%; margin-inline:auto; border-radius:calc(10*var(--u)); background:#FFFFFF center / 100% 100% no-repeat; box-shadow:0 0 0 1px rgba(0,0,0,.14)}
  .scp.page{aspect-ratio:494/720; background-image:url(yootwcx01h5h.png)}
  .scp.scan{aspect-ratio:472/1024; background-image:url(zqjnprvqm5ru.png)}
  .sc-hot{position:absolute; left:88.4%; top:7.6%; width:7%; height:4.8%; border-radius:50%; pointer-events:none}
  /* 掃到 QR 之後 LINE 跳出來的小視窗（照真的畫的：頭像、名字、「官方帳號」、綠色的「加入」） */
  .frs{--bu:max(.857px, var(--u)); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:calc(6*var(--u)); width:calc(260*var(--u)); max-width:100%; margin-inline:auto; padding:calc(18*var(--u)) calc(16*var(--u)) calc(16*var(--u)); border-radius:calc(16*var(--u)); background:#fff; color:#14202B; line-height:1.4; text-align:center; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .frs .fa{width:calc(64*var(--u)); height:calc(64*var(--u)); border-radius:50%; background:#fff var(--i-ava) center / 88% no-repeat; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .frs .fn{font-size:calc(17*var(--bu)); font-weight:700}
  .frs .fo{color:#6B7A88; font-size:calc(12*var(--bu))}
  .frs .fb{margin-top:calc(8*var(--u)); width:100%; padding:calc(11*var(--u)); border-radius:calc(8*var(--u)); background:#06C755; color:#fff; font-size:calc(16*var(--bu)); font-weight:700}
  .frs .fb.hot{box-shadow:0 0 0 calc(3*var(--u)) #2F66E0}

  /* ── 動手試試／重點回顧 ── */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; padding:0 18px; border:0; border-radius:14px; background:var(--btn); color:var(--btn-ink); font-size:16.5px; font-weight:800; text-decoration:none; text-align:center}
  .cap{margin:10px 0 0; color:var(--muted); font-size:13.5px; line-height:1.7; text-align:center}
  .rc{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
  .rc li{display:flex; align-items:flex-start; gap:12px; font-size:15.5px; line-height:1.75}
  .rn{flex:none; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; margin-top:1px; border-radius:50%; background:var(--btn); color:var(--btn-ink); font-size:14px; font-weight:800}
  .end{height:1px}

  /* ── 最下面（上一課／百分比／下一課），固定在畫面底 ── */
  .botbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  .bot-in{display:flex; align-items:center; justify-content:space-between; gap:8px; max-width:var(--col); margin:0 auto; padding:8px 12px}
  .nav{display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:108px; min-height:48px; padding:0 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font-size:15.5px; font-weight:800; text-decoration:none; white-space:nowrap}
  .nav.go{border-color:var(--btn); background:var(--btn); color:var(--btn-ink)}
  .nav[aria-disabled="true"]{opacity:.4; pointer-events:none}
  .pct{font-size:16px; font-weight:800; color:var(--ink2); font-variant-numeric:tabular-nums}
  /* ── 自動示範（第 17 批）：捲到哪一塊示範區，它就自己照順序點一遍；點任何一個選項（或按「停止」）就換你操作 ── */
  .stage.auto{box-shadow:0 0 0 2px var(--focus)}
  .autog{flex:none; display:flex; align-items:center; gap:2px; margin-left:auto}
  .autob::before{content:""; flex:none; width:7px; height:7px; margin-right:6px; border-radius:50%; background:currentColor}
  .autob{display:inline-flex; align-items:center; min-height:28px; padding:0 10px; border-radius:999px; background:var(--soft); color:var(--soft-ink); font-size:12.5px; font-weight:800; white-space:nowrap}
  .astop{min-width:44px; min-height:44px; margin-block:-8px; padding:0 8px; border:0; background:none; color:var(--ink2); font-size:14px; font-weight:700; text-decoration:underline}
  /* 手指（tapAt）：從右下角滑到要按的那一顆（--x、--y 是那一顆的位置，JS 填），按一下，淡出。總共 1 秒，按下去的那一刻在 70%（＝AUTO_TAP_MS 700 毫秒）。不佔位置、不擋人點。 */
  .fg{position:absolute; left:0; top:0; z-index:6; margin:-4px 0 0 -14px; font-size:30px; line-height:1; opacity:0; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); transform:translate(var(--x,0px),var(--y,0px))}
  .fg::before{content:""; position:absolute; left:14px; top:2px; width:34px; height:34px; margin:-17px 0 0 -17px; border:3px solid var(--focus); border-radius:50%; opacity:0}
  .fg{animation:fgtap 1s ease-in-out both}
  .fg::before{animation:fgring 1s ease-out both}
  @keyframes fgtap{
    0%{opacity:0; transform:translate(calc(var(--x,0px) + 38px),calc(var(--y,0px) + 52px)) scale(1)}
    16%{opacity:1}
    60%{opacity:1; transform:translate(var(--x,0px),var(--y,0px)) scale(1)}
    70%{opacity:1; transform:translate(var(--x,0px),var(--y,0px)) scale(.8)}
    82%{opacity:1; transform:translate(var(--x,0px),var(--y,0px)) scale(1)}
    100%{opacity:0; transform:translate(var(--x,0px),var(--y,0px)) scale(1)}
  }
  @keyframes fgring{0%,68%{opacity:0; transform:scale(.3)} 72%{opacity:.95; transform:scale(.5)} 100%{opacity:0; transform:scale(1.7)}}
  /* 電腦瀏覽器那張畫面（br）打 6 位數：一位一位打出來，打完「登入」才亮起來、下面那行小字才出現。只有「示範」（.pop）才有，靜態的畫面全部都在 */
  .bw-in.v i{font-style:normal}
  .rw.pop .bw-in.v i{animation:dig .01s both}
  .rw.pop .bw-in.v i:nth-child(1){animation-delay:.15s}
  .rw.pop .bw-in.v i:nth-child(2){animation-delay:.30s}
  .rw.pop .bw-in.v i:nth-child(3){animation-delay:.45s}
  .rw.pop .bw-in.v i:nth-child(4){animation-delay:.60s}
  .rw.pop .bw-in.v i:nth-child(5){animation-delay:.75s}
  .rw.pop .bw-in.v i:nth-child(6){animation-delay:.90s}
  .rw.pop .bw-go:not(.d){animation:goon .25s 1s both}
  .rw.pop .bw-in.v ~ .bw-h{animation:dig .25s 1s both}
  @keyframes dig{from{opacity:0} to{opacity:1}}
  @keyframes goon{from{opacity:.6} to{opacity:1}}
  /* 第 21 批：「輸入網址」（電腦打開網頁版第 1 步，br 的 enter）。只有示範（.rw.pop）才有動畫：電腦的瀏覽器剛開一個新分頁、網址列是空的（放 --d0 毫秒），
     然後網址一個字一個字打進網址列（第 k 個字在 --d0 + k × --per 毫秒），打完按 Enter（鍵帽閃一下），到 --tl 毫秒，分頁名、🔒、頁面一起換成補藥神器的頁面（向後端要代號中）。
     沒有 .pop（第一次畫出來、減少動態）就直接是最後的樣子：動畫只是讓畫面從「一開始的樣子」走到最後（backwards＝動畫還沒開始之前先停在第一格）。 */
  .bwx .bw-tab{display:grid; padding:0}
  .bwx .bw-tab>span{grid-area:1 / 1; min-width:0; padding:calc(5*var(--u)) calc(16*var(--u)); overflow:hidden; text-overflow:ellipsis}
  .bwx .bw-tab>.t0,.bwx .bw-lk>.l0,.bwx .bw-ph0{visibility:hidden}
  .bwx .bw-url{position:relative}
  .bwx .bw-lk{display:grid}
  .bwx .bw-lk>span{grid-area:1 / 1}
  .bwx .bw-addr{display:grid; align-items:center; color:#14202B}
  .bwx .bw-addr>span{grid-area:1 / 1; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .bwx .bw-ph0{color:#7A8B99}
  .bwx .bw-tx i{font-style:normal}
  .bw-caret{display:none; width:calc(1.5*var(--u)); height:1.2em; margin-left:1px; background:#14202B; vertical-align:text-bottom}
