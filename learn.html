<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="buyao-v" content="v11.22.2 beta">
<title>補藥神器 教學</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="補藥神器 教學">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1E1C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<style>
  /* 補藥神器教學網頁（v11.22.2 beta 第 13 批）：照「氛圍學院」單元頁的排法——課程目錄＋一課一頁往下捲（白底圓角區塊、淺藍說明框、重點回顧、隨堂檢測、最下面上一課／下一課）。
     不用登入、不連任何網站（沒有後端、沒有外部圖／字型）；示範區是 LINE 聊天的假畫面，不放藥品卡片（用藍色色塊代替）；示範的藥名全是編的。
     手機（LINE 內部瀏覽器）優先，電腦也看得下去；淺色、深色都有。 */
  :root{
    color-scheme:light dark;
    --bg:#F9F8F6; --surface:#FFFFFF; --ink:#252423; --ink2:#4A4743; --muted:#6B6863; --line:#E3E2DD; --sunk:#F1F0EC;
    --soft:#EEF3FD; --soft-ink:#1D3F94;
    --blue:#2F66E0; --blue-ink:#FFFFFF; --blue-soft:#DCE7FC;
    --chat:#E8EDF4; --me:#A6E58B; --me-ink:#14210F; --bot:#FFFFFF;
    --ok:#14703A; --ok-soft:#E7F5EC; --no:#B42318; --no-soft:#FDECEA;
    --warn-ink:#7A4B00; --warn-soft:#FFF1C9;
    --pink:#FFE5E2; --pink-ink:#B3261E;
    --btn:#252423; --btn-ink:#FFFFFF; --focus:#2F66E0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141312; --surface:#1F1E1C; --ink:#F0EEEA; --ink2:#CFCBC5; --muted:#A5A19B; --line:#35332F; --sunk:#292826;
      --soft:#1A2640; --soft-ink:#A9C1FF;
      --blue:#5B8CF5; --blue-ink:#0B1220; --blue-soft:#243756;
      --chat:#1B222D; --me:#6FBF55; --me-ink:#0E1A09; --bot:#2A2927;
      --ok:#4ADE80; --ok-soft:#133422; --no:#FF8A80; --no-soft:#3C1D1A;
      --warn-ink:#F3C56B; --warn-soft:#3A2D10;
      --pink:#3E1F1D; --pink-ink:#FF9A92;
      --btn:#F0EEEA; --btn-ink:#141312; --focus:#8DB0FF;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:calc(72px + env(safe-area-inset-top)); scroll-padding-bottom:calc(88px + env(safe-area-inset-bottom))}   /* 用鍵盤跳到的東西，不要被上面那條、固定在底的上一課／下一課列蓋住 */
  body{margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  button{font:inherit; color:inherit; cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:8px}
  [hidden]{display:none!important}
  .sr{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
  .wrap{max-width:640px; margin:0 auto; padding:8px 16px 32px; outline:none}
  .wrap.bot{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .loading{padding:40px 0; text-align:center; color:var(--muted)}

  /* ── 上面那條（目錄頁：✕／補藥神器 教學／不用登入；一課的頁：✕／課名 ▾／第 n 課） ── */
  .bar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top)}
  .bar-in{display:flex; align-items:center; gap:4px; max-width:640px; margin:0 auto; padding:0 8px; min-height:54px}
  .x{flex:none; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:12px; background:none; color:var(--ink); font-size:20px; line-height:1; text-decoration:none}
  .ttl{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 6px; border:0; background:none; font-size:16.5px; font-weight:800; color:var(--ink)}
  .ttl .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ttl .ar{flex:none; font-size:12px; color:var(--muted); transition:transform .15s}
  .ttl[aria-expanded="true"] .ar{transform:rotate(180deg)}
  .tag{flex:none; min-width:64px; padding:0 8px 0 0; text-align:right; font-size:13px; color:var(--muted); white-space:nowrap}
  .tag.chip{min-width:0; margin-right:6px; padding:2px 10px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink2); font-weight:700}
  .toc{position:absolute; left:0; right:0; top:100%; max-height:calc(100vh - 80px); overflow-y:auto; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 18px 30px rgba(0,0,0,.14)}
  .toc-in{max-width:640px; margin:0 auto; padding:10px 16px 16px}

  /* ── 課程目錄 ── */
  .hero{padding:18px 0 4px}
  h1{margin:0 0 10px; font-size:29px; line-height:1.35; font-weight:800; letter-spacing:-.01em; text-wrap:balance}
  .sub{margin:0 0 18px; color:var(--ink2); font-size:15.5px; line-height:1.8}
  .prog{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
  .prog-r{display:flex; justify-content:space-between; align-items:baseline; font-size:14.5px; color:var(--ink2)}
  .prog-r b{font-size:17px; color:var(--ink); font-weight:800}
  .track{height:8px; border-radius:4px; background:var(--line); overflow:hidden}
  .track i{display:block; height:100%; border-radius:4px; background:var(--ok)}
  .cta{display:flex; align-items:center; justify-content:center; min-height:54px; padding:0 18px; border-radius:14px; background:var(--btn); color:var(--btn-ink); font-size:17px; font-weight:800; text-decoration:none; text-align:center}
  .cta.sec2{background:var(--surface); color:var(--ink); border:1.5px solid var(--ink)}
  .all{margin:26px 0 10px; font-size:15px; font-weight:800; color:var(--ink2); letter-spacing:.04em}
  .chap{margin:0 0 12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .chap-h{display:flex; align-items:center; gap:8px; width:100%; min-height:50px; padding:6px 16px; border:0; background:none; text-align:left; font-size:15.5px; font-weight:800}
  .chap-h:focus-visible{outline-offset:-3px; border-radius:17px}   /* 外框畫在按鈕裡面：.chap 的 overflow:hidden 會把畫在外面的部分切掉 */
  .chev{flex:none; width:16px; color:var(--muted); font-size:13px}
  .chap-c{margin-left:auto; color:var(--muted); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .lessons{list-style:none; margin:0; padding:0 8px 8px}
  .lrow{display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 10px; border-radius:12px; text-decoration:none; color:var(--ink)}
  .lrow .li{flex:none; width:22px; text-align:center; color:var(--muted); font-size:14px}
  .lrow .ln{flex:1; min-width:0; font-size:16px; font-weight:700}
  .lrow .lm{flex:none; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
  .lrow.done .li{color:var(--ok); font-weight:800}
  .lrow.cur{background:var(--btn); color:var(--btn-ink)}
  .lrow.cur .li,.lrow.cur .lm{color:var(--btn-ink)}
  .lrow:not(.cur):hover{background:var(--sunk)}
  .foot{padding:22px 0 0; font-size:13px; color:var(--muted); text-align:center; line-height:1.8}
  .link{display:inline-block; min-height:44px; padding:10px 14px; border:0; background:none; color:var(--muted); font-size:13px; text-decoration:underline}
  .reset{display:flex; flex-direction:column; align-items:center; gap:8px}
  .reset p{margin:0; font-size:13.5px; color:var(--ink2)}
  .reset .row{display:flex; gap:10px}
  .sbtn{min-height:44px; padding:0 22px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:15px}
  .sbtn.danger{background:var(--no); border-color:var(--no); color:var(--surface)}

  /* ── 一課（白底圓角區塊一塊接一塊） ── */
  .sec{margin:0 0 14px; padding:18px 16px 16px; background:var(--surface); border:1px solid var(--line); border-radius:22px}
  .sec-h{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin:0 0 8px}
  h2{margin:0; font-size:21px; line-height:1.4; font-weight:800; text-wrap:balance}
  .min{flex:none; margin-top:3px; padding:2px 10px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--muted); font-size:12.5px; font-weight:700; white-space:nowrap}
  .lead{margin:0 0 14px; color:var(--ink2); font-size:15.5px; line-height:1.85}
  .lead b,.note b,.rc b{font-weight:800}
  .lead b,.rc b{color:var(--ink)}
  .note{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--soft); color:var(--ink); font-size:15px; line-height:1.85}
  .note b{color:var(--soft-ink)}
  .warnbox{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--warn-soft); color:var(--warn-ink); font-size:15px; font-weight:700; line-height:1.8}
  .capn{margin:8px 2px 0; font-size:12.5px; color:var(--muted); line-height:1.6}

  /* ── 示範區（LINE 聊天的假畫面） ── */
  .stage{display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:16px; background:var(--sunk)}
  .stage-h{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .stage-t{font-size:14px; font-weight:800; color:var(--ink2)}
  .replay{display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:44px; min-height:44px; padding:0 10px; border:0; border-radius:12px; background:none; color:var(--ink2); font-size:14px; font-weight:700}
  .picks{display:flex; flex-wrap:wrap; gap:8px}
  .pk{min-height:44px; padding:6px 16px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); font-size:15px; font-weight:700}
  .pk[aria-pressed="true"]{border-color:var(--btn); background:var(--btn); color:var(--btn-ink)}
  .picks.list{flex-direction:column; flex-wrap:nowrap}
  .picks.list .pk{display:flex; align-items:center; gap:12px; width:100%; padding:10px 14px; border-radius:14px; text-align:left; font-size:15px; font-weight:600; line-height:1.6}
  .pk .n{flex:none; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--sunk); color:var(--ink); font-size:13px; font-weight:800}
  .pk[aria-pressed="true"] .n{background:var(--btn-ink); color:var(--btn)}
  .chat{display:flex; flex-direction:column; gap:8px; min-height:92px; padding:12px; border-radius:14px; background:var(--chat)}
  .bub{max-width:86%; padding:8px 13px; border-radius:16px; font-size:15px; line-height:1.65; white-space:pre-line; overflow-wrap:anywhere}
  .bub.me{align-self:flex-end; background:var(--me); color:var(--me-ink); border-bottom-right-radius:5px}
  .bub.bot{align-self:flex-start; background:var(--bot); color:var(--ink); border-bottom-left-radius:5px}
  .gapm{align-self:center; padding:2px 12px; border-radius:999px; background:var(--sunk); color:var(--ink2); font-size:12.5px; font-weight:700}
  .hold{align-self:flex-start; display:flex; flex-direction:column; gap:8px; width:min(90%, 340px); padding:10px 12px; border-radius:14px; background:var(--bot); color:var(--ink)}
  .hold-m{display:flex; align-items:center; gap:10px}
  .hold .ic{flex:none; display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:10px; background:var(--blue); color:var(--blue-ink); font-size:19px; font-weight:800}
  .hold-t{min-width:0}
  .hold-t b{display:block; font-size:15px; line-height:1.45}
  .hold-t small{display:block; color:var(--muted); font-size:13px; line-height:1.5}
  .hold-w{padding:7px 10px; border-radius:9px; background:var(--warn-soft); color:var(--warn-ink); font-size:13.5px; font-weight:700; line-height:1.55}
  .bub.pic{display:flex; flex-direction:column; gap:6px; padding:8px}
  .pbox{display:flex; align-items:center; justify-content:center; width:150px; max-width:100%; aspect-ratio:4/3; border-radius:10px; background:rgba(255,255,255,.55); font-size:30px}
  .pcap{font-size:12.5px}
  .bub.voice{display:flex; align-items:center; gap:10px; min-width:150px}
  .bars{display:flex; align-items:center; gap:3px; height:20px}
  .bars i{display:block; width:3px; border-radius:2px; background:var(--me-ink)}
  .bub.paper{padding:0; background:transparent}
  .paper-in{min-width:160px; padding:6px 14px; border-radius:10px; background:#FFF9E3; color:#3C4043; font-size:15px; line-height:30px; font-family:"Kaiti TC","BiauKai","DFKai-SB",cursive,serif; background-image:repeating-linear-gradient(transparent 0 29px, #E4D9A8 29px 30px)}
  .pop{animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

  /* ── LINE 輸入列（按鈕、麥克風的位置） ── */
  .qbar{overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
  .qrow{display:flex; flex-wrap:wrap; gap:6px; padding:8px; border-bottom:1px solid var(--line); background:var(--sunk)}   /* 手機上四顆放不下一排：換行，四顆都看得到 */
  .qchip{flex:none; display:inline-flex; align-items:center; min-height:38px; padding:0 13px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); font-size:13.5px; font-weight:700; white-space:nowrap}
  button.qchip{min-height:44px}
  .qchip.on,.qchip[aria-pressed="true"]{border-color:var(--pink-ink); background:var(--pink); color:var(--pink-ink)}
  .inbar{display:flex; align-items:center; gap:8px; padding:8px 10px}
  .inic{flex:none; display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:var(--sunk); font-size:18px}
  .inic.on{border:2px solid var(--pink-ink); background:var(--pink)}
  .inbox{flex:1; min-width:0; min-height:38px; padding:6px 14px; border-radius:19px; background:var(--sunk); color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  @media (max-width:420px){ .inbar{gap:6px; padding:8px} .inic{width:36px; height:36px; font-size:17px} .inbox{padding:6px 12px} }   /* 窄手機：圖示縮小一點，「輸入訊息」才不會被擠成直排 */
  @media (max-width:359px){ .inic.g{display:none} }   /* 更窄（320）：少畫一個相簿圖示，輸入框才放得下 */
  .cmd{align-self:center; padding:6px 16px; border-radius:999px; background:var(--btn); color:var(--btn-ink); font-size:14px; font-weight:700; text-align:center; line-height:1.5}
  .tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px}
  @media (max-width:440px){ .tiles{grid-template-columns:1fr} }
  .tile{padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg); text-align:center; line-height:1.55}
  .tile .e{display:block; font-size:22px; line-height:1.4}
  .tile b{display:block; font-size:14.5px}
  .tile span.s{display:block; color:var(--muted); font-size:13px}

  /* ── 卡片各部分的位置圖（只有名稱和位置，不是藥品卡片） ── */
  .wf{display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
  .wf-b{display:flex; align-items:center; min-height:40px; padding:8px 12px; border-radius:10px; background:var(--blue-soft); color:var(--ink); font-size:14.5px; font-weight:800; cursor:pointer}
  .wf-b.on{outline:3px solid var(--ink); outline-offset:2px}
  .wf-b.loc{background:var(--pink); color:var(--pink-ink)}
  .wf-b.dim{background:var(--sunk); color:var(--ink2); font-weight:600}
  .wf-top{display:grid; grid-template-columns:minmax(0,1fr) 84px; gap:8px}
  .wf-col{display:flex; flex-direction:column; gap:8px; min-width:0}
  .wf-top .wide{grid-column:1/-1}
  .wf-top .wf-b.icon{justify-content:center; text-align:center}
  .wf-pan{display:flex; flex-direction:column; gap:8px; padding:8px; border-radius:12px; background:var(--sunk)}
  .wf-r{display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:8px; align-items:stretch}
  .wf-r .wf-b{min-height:56px}
  .wf-r .photo,.wf-r .map{justify-content:center; text-align:center}

  /* ── 動手試試／重點回顧／隨堂檢測 ── */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; padding:0 18px; border:0; border-radius:14px; background:var(--btn); color:var(--btn-ink); font-size:16.5px; font-weight:800; text-decoration:none; text-align:center}
  .cap{margin:10px 0 0; color:var(--muted); font-size:13.5px; line-height:1.7; text-align:center}
  .rc{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
  .rc li{display:flex; align-items:flex-start; gap:12px; font-size:15.5px; line-height:1.75}
  .rn{flex:none; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; margin-top:1px; border-radius:50%; background:var(--btn); color:var(--btn-ink); font-size:14px; font-weight:800}
  .q{margin:0 0 4px; font-size:17px; font-weight:800; line-height:1.65}
  .hint{margin:0 0 6px; color:var(--muted); font-size:14px; line-height:1.7}
  .opt{display:flex; align-items:center; gap:12px; width:100%; min-height:54px; margin-top:8px; padding:10px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); text-align:left; font-size:15.5px; font-weight:600; line-height:1.6}
  .ol{flex:none; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid var(--line); border-radius:50%; background:var(--bg); font-size:14px; font-weight:800}
  .opt.ok{border-color:var(--ok); background:var(--ok-soft)}
  .opt.ok .ol{border-color:var(--ok); background:var(--ok); color:var(--surface)}
  .opt.no{border-color:var(--no); background:var(--no-soft); color:var(--ink2)}
  .opt.no .ol{border-color:var(--no); background:var(--no); color:var(--surface)}
  .opt:disabled{cursor:default}
  .res{min-height:1.7em; margin:10px 2px 0; font-size:15px; font-weight:700; line-height:1.75}
  .res.ok{color:var(--ok)} .res.no{color:var(--no)}
  .res span{display:block; color:var(--ink2); font-weight:500}
  .end{height:1px}

  /* ── 最下面（上一課／百分比／下一課），固定在畫面底 ── */
  .botbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  .bot-in{display:flex; align-items:center; justify-content:space-between; gap:8px; max-width:640px; margin:0 auto; padding:8px 12px}
  .nav{display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:108px; min-height:48px; padding:0 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font-size:15.5px; font-weight:800; text-decoration:none; white-space:nowrap}
  .nav.go{border-color:var(--btn); background:var(--btn); color:var(--btn-ink)}
  .nav[aria-disabled="true"]{opacity:.4; pointer-events:none}
  .pct{font-size:16px; font-weight:800; color:var(--ink2); font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important; scroll-behavior:auto!important} }
